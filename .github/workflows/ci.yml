name: Vérifications

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build:
    name: Tests, types et PWA
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
      - name: Préparer pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
          run_install: false
      - name: Préparer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile
      - name: Lancer la batterie de vérifications
        run: pnpm check
